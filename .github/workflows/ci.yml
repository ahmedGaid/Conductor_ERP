name: CI

# Mirrors the local gate harness (scripts/gates/_run.py) + pytest + apps/web
# checks so a regression can't reach main unnoticed. Adds no new quality
# logic — it only runs what a developer already runs locally before "done".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      CELERY_TASK_ALWAYS_EAGER: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gates
        run: python scripts/gates/_run.py all

      - name: Run pytest
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: i18n key parity
        run: node scripts/check-i18n-parity.mjs

      - name: Typecheck
        run: npx tsc -b

      - name: Build (fires prebuild i18n guard + postbuild bundle-size guard)
        run: npm run build
