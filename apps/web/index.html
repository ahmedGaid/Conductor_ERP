<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conductor — نظام تخطيط الموارد</title>
    <!-- SEO + social share (used by the public marketing landing at /#/welcome). og:image is a
         real capture of the landing hero. Paths are root-relative; set an absolute URL per deploy. -->
    <meta
      name="description"
      content="Conductor is an Arabic-first ERP that brings accounting, inventory, sales, purchasing, CRM, and AI into one calm workspace. Run your business like an orchestra."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Conductor ERP" />
    <meta property="og:title" content="Conductor ERP — Run your business like an orchestra" />
    <meta
      property="og:description"
      content="Accounting, inventory, sales, purchasing, CRM, and AI — one calm, Arabic-first workspace."
    />
    <meta property="og:image" content="/landing/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Conductor ERP — Run your business like an orchestra" />
    <meta
      name="twitter:description"
      content="Accounting, inventory, sales, purchasing, CRM, and AI — one calm, Arabic-first workspace."
    />
    <meta name="twitter:image" content="/landing/og.png" />
    <!-- Conductor brand icon system (apps/web/public/branding). favicon.svg auto-adapts to light/dark. -->
    <link rel="icon" href="/branding/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/branding/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/branding/apple-touch-icon.png" />
    <link rel="manifest" href="/branding/site.webmanifest" />
    <meta name="msapplication-config" content="/branding/browserconfig.xml" />
    <meta name="theme-color" content="#000000" />
    <!-- Preload the faces on screen at first paint (Arabic body/medium + Latin body) so they win the
         font-display:optional window and render with zero swap reflow. See src/styles/fonts.css. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Apply the saved presentation preferences before first paint to avoid a flash (no-FOUC).
         Mirrors src/prefs.ts: theme (resolved), accent, density, font size, contrast, motion. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem("erp.theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          root.setAttribute("data-theme", t);
          root.setAttribute("data-accent", localStorage.getItem("erp.accent") || "blue");
          root.setAttribute("data-density", localStorage.getItem("erp.density") || "comfortable");
          root.setAttribute("data-font-size", localStorage.getItem("erp.fontSize") || "default");
          root.setAttribute("data-contrast", localStorage.getItem("erp.contrast") || "normal");
          root.setAttribute("data-motion", localStorage.getItem("erp.motion") || "full");
          root.setAttribute("data-sidebar", localStorage.getItem("erp.sidebar") || "expanded");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
